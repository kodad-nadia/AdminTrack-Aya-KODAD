version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: admintrack-db
    environment:
      POSTGRES_DB: admintrack
      POSTGRES_USER: admintrack
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - admintrack_pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: admintrack-backend
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: admintrack
      DB_USER: admintrack
      DB_PASSWORD: changeme
      JWT_SECRET: changeThisSecretKeyInProductionEnvironmentPlease123456
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: admintrack-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  admintrack_pgdata:
