<div class="container" style="max-width:420px;margin-top:60px;">
  <div class="card">
    <h2>{{ mode === 'login' ? 'Connexion' : 'Créer un compte' }}</h2>

    <input *ngIf="mode === 'register'" [(ngModel)]="nom" placeholder="Nom complet" name="nom">
    <input [(ngModel)]="email" placeholder="Email" name="email" type="email">
    <input [(ngModel)]="motDePasse" placeholder="Mot de passe" name="motDePasse" type="password">

    <p *ngIf="erreur" style="color:#ea4335;">{{ erreur }}</p>

    <button class="btn" (click)="submit()" style="width:100%;">
      {{ mode === 'login' ? 'Se connecter' : "S'inscrire" }}
    </button>

    <p style="margin-top:12px;text-align:center;">
      <a href="javascript:void(0)" (click)="mode = mode === 'login' ? 'register' : 'login'">
        {{ mode === 'login' ? "Pas encore de compte ? S'inscrire" : 'Déjà un compte ? Se connecter' }}
      </a>
    </p>
  </div>
</div>
