server:
  port: 8080

spring:
  application:
    name: admintrack-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:admintrack}
    username: ${DB_USER:admintrack}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

admintrack:
  jwt:
    # IMPORTANT : en production, definir cette valeur via une variable d'environnement,
    # jamais la laisser codee en dur ni versionnee dans Git.
    secret: ${JWT_SECRET:changeThisSecretKeyInProductionEnvironmentPlease123456}
    expiration-ms: 900000   # 15 minutes

springdoc:
  swagger-ui:
    path: /swagger-ui.html
